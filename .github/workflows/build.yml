name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Install Python dependencies
      run: |
        pip install flask flask-socketio cryptography

    - name: Check Python syntax (server)
      run: |
        python -m py_compile server/app.py server/handlers/*.py server/listeners/*.py server/models/*.py server/utils/*.py

    - name: Test Go agent template compilation (with placeholders replaced)
      run: |
        cp server/agent_template.go main.go
        sed -i 's/{{ .C2URL }}/http:\/\/127.0.0.1:5000/g' main.go
        sed -i 's/{{ .BeaconDelay }}/60/g' main.go
        sed -i 's/{{ .Jitter }}/5/g' main.go
        sed -i 's/{{ .UserAgent }}/Mozilla/g' main.go
        sed -i 's/{{ .InsecureTLS }}/true/g' main.go
        sed -i 's/{{ .AutoPersistence }}/false/g' main.go
        sed -i 's/{{ .DebugMode }}/false/g' main.go
        sed -i 's/{{ .AgentVersion }}/test-version/g' main.go
        sed -i 's/{{ .EnableAuth }}/false/g' main.go
        sed -i 's/{{ .ServerPublicKey }}//g' main.go
        go build -o /dev/null main.go
      working-directory: ./

    - name: Lint Go code (optional)
      run: |
        go vet ./...
      continue-on-error: true
